[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholargraph"
version = "0.4.0"
description = "基于 LangGraph 的多智能体学术文献调研系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint>=4.2",
    "langgraph-checkpoint-sqlite>=3.1",
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "arxiv>=2.1",
    "requests>=2.31",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
scholargraph = "scholargraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # 行宽交给 ruff format；含中文的长字符串不强行折行
